name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Super-Linter
        uses: super-linter/super-linter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_JSON: true
          LINTER_RULES_PATH: .
          PYTHON_RUFF_CONFIG_FILE: ruff.toml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Build shared wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: shared-wheel
          path: dist/*.whl
          if-no-files-found: error

  shared:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: litinoveweedle/SMioplus-ha
          ref: master
          path: .ci/SMioplus-ha
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: litinoveweedle/SMmultiio-ha
          ref: master
          path: .ci/SMmultiio-ha
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shared-wheel
          path: .ci/dist
      - name: Install test dependencies and shared wheel
        run: |
          python -m pip install 'homeassistant==2026.11.1' 'pytest-homeassistant==2026.11.1'
          python .github/scripts/install-card-requirements.py .ci/SMioplus-ha .ci/SMmultiio-ha
          python -m pip install --force-reinstall --no-deps .ci/dist/*.whl
      - name: Test shared library and coexistence
        env:
          SMIOPLUS_REPO: ${{ github.workspace }}/.ci/SMioplus-ha
          SMMULTIIO_REPO: ${{ github.workspace }}/.ci/SMmultiio-ha
        run: >-
          python -m pytest -p no:respx --asyncio-mode=auto
          -o asyncio_default_fixture_loop_scope=function -q tests

  cards:
    name: ${{ matrix.repository }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - SMioplus-ha
          - SMmultiio-ha
          - SM16inpind-ha
          - SM16relind-ha
          - SMmegaind-ha
          - SMtc-ha
          - SMrtd-ha
          - SM16univin-ha
          - SMmegabas-ha
          - SM8relind-ha
          - SM4relind-ha
          - SM16uout-ha
          - SM8mosind-ha
          - SM8inputs-ha
          - SM8crt-ha
          - SMsfan-ha
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: litinoveweedle/${{ matrix.repository }}
          ref: master
          path: .ci/card
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: shared-wheel
          path: .ci/dist
      - name: Install test dependencies and shared wheel
        run: |
          python -m pip install 'homeassistant==2026.11.1' 'pytest-homeassistant==2026.11.1'
          python .github/scripts/install-card-requirements.py .ci/card
          python -m pip install --force-reinstall --no-deps .ci/dist/*.whl
      - name: Run card tests
        working-directory: .ci/card
        run: >-
          python -m pytest -p no:respx --asyncio-mode=auto
          -o asyncio_default_fixture_loop_scope=function -q tests
